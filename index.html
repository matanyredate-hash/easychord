<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easychords - מעבד אקורדים מתקדם</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding-bottom: 80px; }
    .container { max-width: 900px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; }
    .toolbar button { margin-bottom: 0; width: auto; }
    
    #song-output {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;
      line-height: 1.8;
      white-space: pre-wrap;
      background: #1e1e1e;
      color: #ffffff;
      padding: 25px;
      border-radius: 8px;
      overflow-x: auto;
      direction: rtl;
      text-align: right;
    }

    .chord-line {
      color: #4ec9b0;
      font-weight: bold;
      direction: ltr;
      text-align: right;
      min-height: 1.2em;
    }

    .text-line {
      color: #ffffff;
      margin-bottom: 0.8em;
    }

    .chord {
      color: #4ec9b0;
      font-weight: bold;
      cursor: pointer;
    }
    .chord:hover { text-decoration: underline; color: #569cd6; }

    .fretboard { display: inline-block; margin: 15px 0; font-family: monospace; font-size: 1.2rem; background: #2d2d2d; padding: 15px; border-radius: 6px; }
    .recommend-badge { background: #2e7d32; color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; }
    .experimental-box { border: 1px dashed #0096ff; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <main class="container">
    <h2>🎸 Easychords - מעבד אקורדים</h2>

    <!-- אפשרות ניסיונית: טעינה מכתובת אתר -->
    <div class="experimental-box">
      <small>🧪 <strong>אופציה ניסיונית:</strong> טעינת שיר מכתובת אתר (URL)</small>
      <div style="display: flex; gap: 10px; margin-top: 5px;">
        <input type="url" id="url-input" placeholder="הכנס קישור לדף שיר..." style="margin-bottom: 0;">
        <button onclick="fetchFromUrl()" class="secondary" style="white-space: nowrap;">טען אתר</button>
      </div>
      <small id="url-status" style="color: #aaa;"></small>
    </div>

    <details open>
      <summary>תוכן השיר (הדבקה / עריכה)</summary>
      
      <div style="margin-bottom: 10px;">
        <label><small>פורמט הקלט:</small></label>
        <select id="paste-format" onchange="render()">
          <option value="bracketed">אקורדים בסוגריים [F] בתוך הטקסט</option>
          <option value="standard">שורת אקורדים מעל שורת מילים</option>
        </select>
      </div>

      <textarea id="song-input" rows="8" placeholder="הדבק כאן את השיר...
לדוגמה:
הלוו [F] שלא יגמר [Am] 

או בשורות נפרדות:
F           Am
הלוו שלא יגמר"></textarea>
    </details>

    <!-- סרגל כלים -->
    <div class="toolbar">
      <div>
        <small>טרנספוזיציה (שינוי טון):</small><br>
        <button onclick="changeKey(-1)" class="outline">-1 טון</button>
        <span id="key-offset" style="font-weight: bold; padding: 0 5px;">0</span>
        <button onclick="changeKey(1)" class="outline">+1 טון</button>
      </div>

      <div>
        <small>קאפו (Capo):</small><br>
        <select id="capo-select" onchange="render()" style="margin-bottom:0;">
          <option value="0">ללא קאפו</option>
          <option value="1">סריג 1</option>
          <option value="2">סריג 2</option>
          <option value="3">סריג 3</option>
          <option value="4">סריג 4</option>
          <option value="5">סריג 5</option>
        </select>
      </div>

      <label style="display:flex; align-items:center; gap:5px; margin-bottom:0; cursor:pointer;">
        <input type="checkbox" id="simplify-check" onchange="render()">
        <span>פישוט אקורדים</span>
      </label>

      <button onclick="autoCapo()" class="contrast" style="margin-right: auto;">🪄 המלץ על קאפו מתאים</button>
    </div>

    <!-- גלילה אוטומטית -->
    <div class="toolbar" style="background: rgba(0, 150, 255, 0.1);">
      <button id="scroll-btn" onclick="toggleScroll()" class="secondary">▶ הפעל גלילה אוטומטית</button>
      <label style="display:flex; align-items:center; gap:8px; margin-bottom:0;">
        מהירות:
        <input type="range" id="scroll-speed" min="1" max="10" value="3">
      </label>
      <span id="recommend-msg" class="recommend-badge" style="display:none;"></span>
    </div>

    <!-- תצוגת השיר הסטייליסטית -->
    <div id="song-output"></div>
  </main>

  <dialog id="chord-modal">
    <article style="text-align: center;">
      <h3 id="modal-chord-name"></h3>
      <div id="modal-chord-diagram" class="fretboard"></div>
      <footer>
        <button onclick="document.getElementById('chord-modal').close()">סגור</button>
      </footer>
    </article>
  </dialog>

  <script>
    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const BARE_CHORDS = ['F', 'F#', 'B', 'Bm', 'Fm', 'F#m', 'C#', 'C#m', 'G#', 'G#m', 'D#', 'D#m'];
    const GUITAR_TABS = {
      'C': 'x 3 2 0 1 0', 'G': '3 2 0 0 0 3', 'Am': 'x 0 2 2 1 0',
      'Em': '0 2 2 0 0 0', 'D': 'x x 0 2 3 2', 'Dm': 'x x 0 2 3 1',
      'E': '0 2 2 1 0 0', 'A': 'x 0 2 2 2 0', 'F': '1 3 3 2 1 1 (בארה)'
    };

    let currentOffset = 0;
    let scrollInterval = null;

    function transposeNote(note, semitones) {
      const altMap = {'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#'};
      const cleanNote = altMap[note] || note;
      const index = NOTES.indexOf(cleanNote);
      if (index === -1) return note;
      let newIndex = (index + semitones) % 12;
      if (newIndex < 0) newIndex += 12;
      return NOTES[newIndex];
    }

    function processChord(chordStr, semitones, simplify) {
      const regex = /^([A-G][#b]?)(.*?)(?:\/([A-G][#b]?))?$/;
      const match = chordStr.match(regex);
      if (!match) return chordStr;

      let [, root, quality, bass] = match;

      if (simplify) {
        if (quality.includes('m') && !quality.includes('maj')) quality = 'm';
        else quality = '';
        bass = null;
      }

      const newRoot = transposeNote(root, semitones);
      const newBass = bass ? '/' + transposeNote(bass, semitones) : '';
      return `${newRoot}${quality}${newBass}`;
    }

    const chordRegex = /\b[A-G][#b]?(?:maj|min|m|dim|aug|sus|add|\d)*?(?:\/[A-G][#b]?)?\b/g;

    function render() {
      const input = document.getElementById('song-input').value;
      const format = document.getElementById('paste-format').value;
      const capo = parseInt(document.getElementById('capo-select').value);
      const simplify = document.getElementById('simplify-check').checked;
      const totalSemitones = currentOffset - capo;

      let htmlResult = '';
      const lines = input.split('\n');

      if (format === 'bracketed') {
        lines.forEach(line => {
          let chordLine = '';
          let textLine = '';
          let i = 0;

          while (i < line.length) {
            if (line[i] === '[') {
              let end = line.indexOf(']', i);
              if (end !== -1) {
                let rawChord = line.substring(i + 1, end).trim();
                let processed = processChord(rawChord, totalSemitones, simplify);
                let chordSpan = `<span class="chord" onclick="showDiagram('${processed}')">${processed}</span>`;
                
                chordLine += chordSpan;
                i = end + 1;
                continue;
              }
            }

            let char = line[i];
            textLine += char;
            if (chordLine.replace(/<[^>]*>/g, '').length < textLine.length) {
              chordLine += ' ';
            }
            i++;
          }

          if (chordLine.trim().length > 0) {
            htmlResult += `<div class="chord-line">${chordLine}</div>`;
          }
          htmlResult += `<div class="text-line">${textLine || '&nbsp;'}</div>`;
        });
      } else {
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const isChordLine = line.replace(chordRegex, '').trim() === '';

          if (isChordLine && line.trim().length > 0) {
            let processed = line.replace(chordRegex, (chord) => {
              let p = processChord(chord, totalSemitones, simplify);
              return `<span class="chord" onclick="showDiagram('${p}')">${p}</span>`;
            });
            htmlResult += `<div class="chord-line">${processed}</div>`;
          } else {
            htmlResult += `<div class="text-line">${line || '&nbsp;'}</div>`;
          }
        }
      }

      document.getElementById('song-output').innerHTML = htmlResult;
    }

    function changeKey(delta) {
      currentOffset += delta;
      document.getElementById('key-offset').innerText = (currentOffset > 0 ? '+' : '') + currentOffset;
      render();
    }

    function autoCapo() {
      const input = document.getElementById('song-input').value;
      const chords = input.match(chordRegex) || [];
      if (chords.length === 0) return;

      let bestCapo = 0;
      let minBareCount = Infinity;

      for (let capo = 0; capo <= 5; capo++) {
        let bareCount = 0;
        chords.forEach(c => {
          const transposed = processChord(c, -capo, true);
          if (BARE_CHORDS.includes(transposed)) bareCount++;
        });

        if (bareCount < minBareCount) {
          minBareCount = bareCount;
          bestCapo = capo;
        }
      }

      document.getElementById('capo-select').value = bestCapo;
      const msg = document.getElementById('recommend-msg');
      msg.style.display = 'inline-block';
      msg.innerText = `💡 מומלץ: קאפו בסריג ${bestCapo}`;
      render();
    }

    function showDiagram(chord) {
      document.getElementById('modal-chord-name').innerText = `אקורד ${chord}`;
      const tab = GUITAR_TABS[chord] || 'x x 0 2 3 2 (תרשים כללי)';
      document.getElementById('modal-chord-diagram').innerText = `מיתרים (E A D G B e):\n${tab}`;
      document.getElementById('chord-modal').showModal();
    }

    function toggleScroll() {
      const btn = document.getElementById('scroll-btn');
      if (scrollInterval) {
        clearInterval(scrollInterval);
        scrollInterval = null;
        btn.innerText = '▶ הפעל גלילה אוטומטית';
        btn.classList.replace('primary', 'secondary');
      } else {
        const speed = 11 - document.getElementById('scroll-speed').value;
        scrollInterval = setInterval(() => window.scrollBy(0, 1), speed * 10);
        btn.innerText = '⏸ השהה גלילה';
        btn.classList.replace('secondary', 'primary');
      }
    }

    /* פונקציה ניסיונית לשליפת תוכן מקישור (URL) */
    async function fetchFromUrl() {
      const urlInput = document.getElementById('url-input').value.trim();
      const status = document.getElementById('url-status');
      
      if (!urlInput) {
        status.innerText = 'נא להכניס כתובת תקינה.';
        return;
      }

      status.innerText = 'מנסה שטוען תוכן מהאתר...';

      try {
        // שימוש ב-Proxy לעקיפת חסימות CORS בדפדפן
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(urlInput);
        const response = await fetch(proxyUrl);
        
        if (!response.ok) throw new Error('שגיאה בגישה לשרת הפרוקסי');

        const data = await response.json();
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // חיפוש טקסט מתוך תגיות שיר נפוצות (pre, article, code, main)
        let extractedText = '';
        const targetElements = doc.querySelectorAll('pre, article, .chords, .song-content');

        if (targetElements.length > 0) {
          targetElements.forEach(el => extractedText += el.innerText + '\n');
        } else {
          extractedText = doc.body.innerText;
        }

        if (extractedText.trim()) {
          document.getElementById('song-input').value = extractedText.trim();
          status.innerText = 'התוכן נטען בהצלחה!';
          render();
        } else {
          status.innerText = 'לא נשלף טקסט תקין מהעמוד.';
        }
      } catch (err) {
        console.error(err);
        status.innerText = 'שגיאה בטעינת האתר (יתכן שהאתר חוסם גישה חיצונית).';
      }
    }

    document.getElementById('song-input').addEventListener('input', render);
    render();
  </script>
</body>
</html>
